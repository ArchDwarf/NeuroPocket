name: Сборка APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: CMake для Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" > /dev/null

      - name: Сборка
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: NeuroPocket-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Публикация в Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: NeuroPocket для Android (последняя сборка)
          body: |
            APK для Android 9+ (arm64). Сборка из коммита ${{ github.sha }}.
          files: app/build/outputs/apk/release/*.apk
          overwrite_files: true
          make_latest: false
