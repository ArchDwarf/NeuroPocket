name: Компьютерная версия (Windows)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Быстрая проверка Kotlin-кода (несколько минут), чтобы ошибки было видно сразу
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Компиляция Kotlin
        run: |
          chmod +x gradlew
          ./gradlew -p desktop compileKotlin --no-daemon

  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    timeout-minutes: 300
    env:
      VULKAN_VERSION: 1.4.357.0
      SHERPA_VERSION: 1.13.8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Кэш собранных нативных библиотек: повторные сборки занимают минуты, а не час
      - name: Кэш нативной сборки
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build-llm
            build-sd-vk
            build-sd-cpu
          key: native-win-${{ env.VULKAN_VERSION }}-${{ hashFiles('app/src/main/cpp/**', 'sdengine/src/main/cpp/**') }}

      - name: Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: llama.cpp (видеокарта Vulkan + процессор)
        shell: pwsh
        run: |
          cmake -S app/src/main/cpp -B build-llm -DGGML_VULKAN=ON
          cmake --build build-llm --config Release --parallel 4

      - name: stable-diffusion.cpp (Vulkan)
        shell: pwsh
        run: |
          cmake -S sdengine/src/main/cpp -B build-sd-vk -DSD_VULKAN=ON -DSD_JNI_NAME=sdengine_vk
          cmake --build build-sd-vk --config Release --target sdengine --parallel 4

      - name: stable-diffusion.cpp (процессор)
        shell: pwsh
        run: |
          cmake -S sdengine/src/main/cpp -B build-sd-cpu -DSD_JNI_NAME=sdengine_cpu
          cmake --build build-sd-cpu --config Release --target sdengine --parallel 4

      # Сохраняем кэш сразу, даже если упадёт упаковка
      - name: Сохранение кэша
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build-llm
            build-sd-vk
            build-sd-cpu
          key: native-win-${{ env.VULKAN_VERSION }}-${{ hashFiles('app/src/main/cpp/**', 'sdengine/src/main/cpp/**') }}

      - name: Сбор библиотек
        shell: pwsh
        run: python .github/scripts/collect_dlls.py

      - name: Установщик
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew -p desktop packageMsi packageExe --no-daemon

      - name: Загрузка установщика
        uses: actions/upload-artifact@v4
        with:
          name: NeuroPocket-Windows
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe

      - name: Публикация в Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: NeuroPocket для Windows (последняя сборка)
          body: |
            Установщик NeuroPocket для Windows 10/11 (x64). Видеокарта через Vulkan (NVIDIA, AMD, Intel), без неё — процессор.
            Сборка из коммита ${{ github.sha }}.
          files: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
          overwrite_files: true
          make_latest: true
